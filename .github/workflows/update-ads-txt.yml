name: Update ads.txt from Ezoic

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 3:00 AM UTC
  workflow_dispatch:

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest ads.txt from Ezoic
        run: |
          curl -L https://srv.adstxtmanager.com/19390/dog-park.info -o ads.txt

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet ads.txt; then
            git add ads.txt
            git commit -m "Update ads.txt from Ezoic"
            git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/linking2success/texas-dog-parks.git HEAD:${{ github.ref }}
          else
            echo "No changes to ads.txt"
          fi